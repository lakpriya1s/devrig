<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">devrig logo</title>
  <desc id="desc">A hexagonal developer rig containing three connected repository modules, paired with the devrig wordmark.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="68" y1="78" x2="255" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: rig frame -->
  <g transform="translate(0,0)">
    <path d="M160 34 L258 91 L258 204 L160 261 L62 204 L62 91 Z"
          fill="none" stroke="url(#brandGradient)" stroke-width="14"
          stroke-linejoin="round"/>

    <!-- Three repo modules -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="98" y="91" width="118" height="32" rx="10"
            stroke="url(#brandGradient)" stroke-width="10"/>
      <rect x="98" y="137" width="118" height="32" rx="10"
            stroke="url(#brandGradient)" stroke-width="10"/>
      <rect x="98" y="183" width="118" height="32" rx="10"
            stroke="url(#brandGradient)" stroke-width="10"/>

      <!-- repo status dots -->
      <circle cx="119" cy="107" r="4.8" fill="#22D3EE" stroke="none"/>
      <circle cx="119" cy="153" r="4.8" fill="#3B82F6" stroke="none"/>
      <circle cx="119" cy="199" r="4.8" fill="#8B5CF6" stroke="none"/>

      <!-- code lanes -->
      <path d="M137 107 H188" stroke="url(#brandGradient)" stroke-width="7"/>
      <path d="M137 153 H177" stroke="url(#brandGradient)" stroke-width="7"/>
      <path d="M137 199 H192" stroke="url(#brandGradient)" stroke-width="7"/>

      <!-- shared workspace spine -->
      <path d="M226 106 H236 V200 H226" stroke="url(#brandGradient)" stroke-width="9"/>
      <circle cx="236" cy="153" r="7" fill="#3B82F6" stroke="none" filter="url(#softGlow)"/>
    </g>

    <!-- setup spark / single entrypoint -->
    <path d="M77 65 L84 82 L101 89 L84 96 L77 113 L70 96 L53 89 L70 82 Z"
          fill="url(#brandGradient)"/>
  </g>
  
    <g aria-label="devrig">
      <text x="330" y="199"
            font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="142" font-weight="760" letter-spacing="-7"
            fill="#F8FAFC">dev</text>
      <text x="585" y="199"
            font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="142" font-weight="760" letter-spacing="-7"
            fill="url(#brandGradient)">rig</text>
      <text x="337" y="248"
            font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="27" font-weight="560" letter-spacing="5.5"
            fill="#94A3B8">MULTI-REPO AI WORKSPACE</text>
    </g>
    
</svg>