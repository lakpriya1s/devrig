name: Knowledge check

on:
  pull_request:
    paths:
      - "knowledge/**"
      - ".ai/policies.yaml"
      - "scripts/**"

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontmatter, links, ADR ids, and index freshness
        run: node scripts/validate-knowledge.mjs

      - name: Require an ADR when a protected path changes
        run: |
          node scripts/check-adr-requirement.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Surface documentation drift (informational — never fails)
        run: node scripts/detect-doc-drift.mjs
