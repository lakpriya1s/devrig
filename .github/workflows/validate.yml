name: Validate

on:
  pull_request:
    paths:
      - ".ai/**"

jobs:
  validate-ai-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate .ai/*.yaml against .ai/schemas/
        run: node scripts/validate-ai-config.mjs
